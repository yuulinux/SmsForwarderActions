name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      # 生成假签名
      - name: Generate fake keystore
        run: |
          keytool -genkey -v -keystore my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-alias -storepass 123456 -keypass 123456 -dname "CN=Fake, OU=Fake, O=Fake, L=Fake, S=Fake, C=CN"
          
      # 强制打 Release 包，并传入假签名参数
      - name: Build with Gradle
        run: |
          bash ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=${{ github.workspace }}/my-release-key.jks \
          -Pandroid.injected.signing.store.password=123456 \
          -Pandroid.injected.signing.key.alias=my-alias \
          -Pandroid.injected.signing.key.password=123456

      # 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-APK
          path: ./app/build/outputs/apk/release/*.apk
