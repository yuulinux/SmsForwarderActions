name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - uses: actions/checkout@v4
      
      # 2. 设置 JDK 17 (现在大部分安卓项目推荐17)
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      # 3. 临时生成一个假的签名文件，骗过编译系统
      - name: Generate fake keystore
        run: |
          keytool -genkey -v -keystore fake.jks -keyalg RSA -keysize 2048 -validity 10000 -alias fakeAlias -storepass 123456 -keypass 123456 -dname "CN=Fake, OU=Fake, O=Fake, L=Fake, S=Fake, C=CN"
          
      # 4. 传递假签名的环境变量，并编译 Debug 包
      - name: Build with Gradle
        env:
          # 这里的环境变量名字需要看原作者 build.gradle 里是怎么写的。
          # 我这里配置了几个最常见的变量名，如果原作者是通过环境变量读取的，就能骗过去。
          KEYSTORE_FILE: ${{ github.workspace }}/fake.jks
          KEYSTORE_PASSWORD: 123456
          KEY_ALIAS: fakeAlias
          KEY_PASSWORD: 123456
          STORE_FILE: ${{ github.workspace }}/fake.jks
          STORE_PASSWORD: 123456
        run: bash ./gradlew assembleDebug

      # 5. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-Debug
          path: ./app/build/outputs/apk/debug/*.apk
