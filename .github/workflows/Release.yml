name: Build APK

on:
  workflow_dispatch: # 纯手动触发，不需要填写任何参数

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出你的代码
      - uses: actions/checkout@v4
      
      # 2. 设置 JDK 11（保持和原作者一致）
      - name: set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
          java-package: jdk
          
      # 3. 打包 Debug 版（无需签名，直接能装）
      - name: Build with Gradle
        run: bash ./gradlew assembleDebug
        
      # 4. 将打好的 APK 上传到 Actions 页面供你下载
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-Debug
          path: ./build/app/outputs/apk/debug/*.apk
